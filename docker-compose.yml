# KIAN — compose for the local test night and small-scale deployment
#
#   docker compose up --build
#
# Ports:
#   8088  → Rust kernel (kian-server)
#   3000  → web (apps/web — landing)
#   3001  → miniapp (apps/miniapp — dev mode, mounted source)
#   3002  → admin panel (apps/admin — dev mode, mounted source)
#
# Admin: http://localhost:3002 with key dev-admin-key (change the variable below in production!)

services:
  kian-server:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.server
    ports:
      - "8088:8088"
    environment:
      KIAN_HOST: 0.0.0.0
      KIAN_PORT: "8088"
      KIAN_DEV_MODE: "true"            # set to false / remove in production
      KIAN_ADMIN_KEY: dev-admin-key    # use a ≥16-character key in production
      KIAN_DATABASE_URL: /data/kian.sqlite
    volumes:
      - kian-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  kian-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_KIAN_API: http://localhost:8088/api/v1
    depends_on:
      kian-server:
        condition: service_healthy

  kian-miniapp:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @kian/miniapp exec next dev -p 3001"
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_KIAN_API: http://localhost:8088/api/v1
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: KianAgentBot
    volumes:
      - .:/app
    depends_on:
      kian-server:
        condition: service_healthy

  kian-admin:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @kian/admin exec next dev -p 3002"
    ports:
      - "3002:3002"
    environment:
      NEXT_PUBLIC_KERNEL_URL: http://localhost:8088
    volumes:
      - .:/app
    depends_on:
      kian-server:
        condition: service_healthy

volumes:
  kian-data:
