[package]
name = "kian-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "\u0644\u0627\u06cc\u0647 \u0645\u0627\u0646\u062f\u06af\u0627\u0631\u06cc \u06a9\u0631\u0646\u0644 \u067e\u0648\u0644 — sqlx/sqlite\u060c \u0645\u0647\u0627\u062c\u0631\u062a‌\u0647\u0627\u06cc \u0646\u0633\u062e\u0647‌\u062f\u0627\u0631\u060c V3Store\u060c outbox \u0648 \u0645\u0645\u06cc\u0632\u06cc genesis"

[dependencies]
kian-domain = { path = "../domain" }
# persistence — sqlite (legacy decision: same v3 substrate for dual-run on «the same file»)
sqlx = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# Backup phase — tokio::fs for VACUUM INTO + pruning (same as legacy)
tokio = { workspace = true }

[dev-dependencies]
# #[tokio::test] for the integration tests
tokio = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
