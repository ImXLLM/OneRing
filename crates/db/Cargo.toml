[package]
name = "kian-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "لایه ماندگاری کرنل پول — sqlx/sqlite، مهاجرت‌های نسخه‌دار، V3Store، outbox و ممیزی genesis"

[dependencies]
kian-domain = { path = "../domain" }
# persistence — sqlite (تصمیم legacy: همان بستر v3 برای dual-run روی «همان فایل»)
sqlx = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# فاز بکاپ — tokio::fs برای VACUUM INTO + هرس (همان legacy)
tokio = { workspace = true }

[dev-dependencies]
# #[tokio::test] برای تست‌های یکپارچگی
tokio = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
