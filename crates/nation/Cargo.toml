[package]
name = "kian-nation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "دولت HITL — پارلمان، آستانه ۵۰,۰۰۰ Đ، اقتصاد Đ"

[dependencies]
# گره با منشور — گیت مادهٔ ۷ از دامنهٔ خالص می‌آید (یک منبع حقیقت)
kian-domain = { path = "../domain" }
