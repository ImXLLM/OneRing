[package]
name = "kian-bot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MAIRON sovereign Telegram adapter — teloxide 0.17, pure offline-testable orchestrator with the sovereign command suite"

[dependencies]
# Pure core — wire contract only (initData mint/verify lives in kian-contracts)
kian-contracts = { path = "../contracts" }
# Instant FAQ responder (zero tokens) — port of the Hermes bot (vault folder 03)
kian-hermes = { path = "../hermes" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
# Shells — teloxide long-polling (rustls; never openssl-system) + kernel HTTP
teloxide = { workspace = true, features = ["rustls"] }
reqwest = { workspace = true }
tokio = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "kian-bot"
path = "src/main.rs"

[lib]
name = "kian_bot"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
