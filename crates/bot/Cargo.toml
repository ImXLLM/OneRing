[package]
name = "kian-bot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "آداپتور تلگرام — teloxide 0.17، orchestrator خالص آفلاین‌تست‌پذیر"

[dependencies]
# هستهٔ خالص — فقط قرارداد وایر (initData ضرب/تأیید در kian-contracts است)
kian-contracts = { path = "../contracts" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
# شِل‌ها — طول‌کشی teloxide (rustls؛ هرگز openssl-system) + HTTP کرنل
teloxide = { workspace = true, features = ["rustls"] }
reqwest = { workspace = true }
tokio = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "kian-bot"
path = "src/main.rs"

[lib]
name = "kian_bot"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
