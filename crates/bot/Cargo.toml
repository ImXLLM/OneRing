[package]
name = "kian-bot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "\u0622\u062f\u0627\u067e\u062a\u0648\u0631 \u062a\u0644\u06af\u0631\u0627\u0645 — teloxide 0.17\u060c orchestrator \u062e\u0627\u0644\u0635 \u0622\u0641\u0644\u0627\u06cc\u0646‌\u062a\u0633\u062a‌\u067e\u0630\u06cc\u0631"

[dependencies]
# Pure core — wire contract only (initData mint/verify lives in kian-contracts)
kian-contracts = { path = "../contracts" }
# Instant FAQ responder (zero tokens) — port of the Hermes bot (vault folder 03)
kian-hermes = { path = "../hermes" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
# Shells — teloxide long-polling (rustls; never openssl-system) + kernel HTTP
teloxide = { workspace = true, features = ["rustls"] }
reqwest = { workspace = true }
tokio = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }

[[bin]]
name = "kian-bot"
path = "src/main.rs"

[lib]
name = "kian_bot"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
