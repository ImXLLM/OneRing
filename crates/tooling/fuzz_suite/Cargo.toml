[package]
name = "dropagentx-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Phase 8 cargo-fuzz skeleton (ADR-009 §7 phase 8 / §14.3):
#   cargo +nightly fuzz build
#   cargo +nightly fuzz run fuzz_ai_chat -- -max_total_time=300
# The targets are the same boundary parsers that are also covered deterministically in
# tests/fuzz_lite.rs; this libfuzzer edition runs on nightly (CI only).

[dependencies]
libfuzzer-sys = "0.4"
dropagentx-contracts = { path = "../crates/contracts" }

[[bin]]
name = "fuzz_mint_request"
path = "fuzz_targets/fuzz_mint_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_create_escrow"
path = "fuzz_targets/fuzz_create_escrow.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ai_chat"
path = "fuzz_targets/fuzz_ai_chat.rs"
test = false
doc = false
bench = false
