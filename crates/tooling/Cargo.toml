[package]
name = "kian-tooling"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "\u0627\u0628\u0632\u0627\u0631\u0647\u0627\u06cc \u062d\u0633\u0627\u0628\u0631\u0633\u06cc \u06a9\u06cc\u0627\u0646 — \u0646\u0628\u0648\u062f\u0647\u0627\u06cc \u0642\u0637\u0639\u06cc fuzz \u0631\u0648\u06cc \u0642\u0631\u0627\u0631\u062f\u0627\u062f\u0647\u0627\u06cc \u0648\u0631\u0648\u062f\u06cc (\u067e\u0648\u0631\u062a fuzz \u0647\u062f\u0641‌\u0647\u0627\u06cc \u067e\u0648\u0634\u0647\u0654 \u06f0\u06f7)"

[dependencies]
# Lean library — everything missing lives in the tests (dev-dependencies)

[dev-dependencies]
kian-contracts = { path = "../contracts" }
kian-domain = { path = "../domain" }
kian-hermes = { path = "../hermes" }
serde_json = { workspace = true }

# Raw reference directories (never compiled — external packages excluded at the root):
#   fuzz_suite/  — cargo-fuzz skeleton with libfuzzer (nightly only; kept untouched)
#   vault_pro/   — DropAgentX-pro dual-run/parity toolbox (historical reference)

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
