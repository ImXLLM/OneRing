[package]
name = "kian-tooling"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ابزارهای حسابرسی کیان — نبودهای قطعی fuzz روی قراردادهای ورودی (پورت fuzz هدف‌های پوشهٔ ۰۷)"

[dependencies]
# کتابخانهٔ ساده — همهٔ نبودها در تست‌ها هستند (dev-dependencies)

[dev-dependencies]
kian-contracts = { path = "../contracts" }
kian-domain = { path = "../domain" }
kian-hermes = { path = "../hermes" }
serde_json = { workspace = true }

# پوشه‌های خام مرجع (هرگز کامپایل نمی‌شوند — بسته‌های بیرونی در ریشه excluded):
#   fuzz_suite/  — اسکلت cargo-fuzz با libfuzzer (فقط nightly؛ حفظ دست‌نخورده)
#   vault_pro/   — جعبه‌ابزار dual-run/parity DropAgentX-pro (مرجع تاریخی)

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
