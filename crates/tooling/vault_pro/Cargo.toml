regex = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
dropagentx-contracts = { workspace = true }

[[bin]]
name = "dual-run"
path = "src/bin/dual-run.rs"

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[[bin]]
name = "audit-ledger"
path = "src/bin/audit-ledger.rs"

[[bin]]
name = "loadtest"
