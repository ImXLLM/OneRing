[package]
name = "dropagentx-tooling"
description = "\u0627\u0628\u0632\u0627\u0631 — \u0645\u0647\u0627\u062c\u0631\u062a \u0644\u06af\u0627\u0633\u06cc\u060c genesis_proof\u060c dual_run\u060c audit_ledger\u060c parity\u060c loadtest (\u0641\u0627\u0632 \u06f2/\u06f8)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
