[package]
name = "kian-server"
version = "0.1.0"
# Deployment note (Railway/Railpack): the Railpack v0.43 TOML parser does not understand
# the dotted workspace-inheritance keys (`*.workspace = true`) — if every crate is shaped this way, no
# member is parsed and Railpack does not compile the binary («No start command detected»
# and «./bin/kian-server: No such file or directory» come from exactly this). The values in this
# crate are intentionally written out directly so Railpack always picks `kian-server` as the
# deployment binary. If you ever make the remaining crates direct too, set the Railway variable
# RAILPACK_CARGO_WORKSPACE=kian-server to make the selection deterministic.
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
description = "MAIRON Sovereign HTTP/WS Kernel, Quantitative Engine & War-Room Server"

[[bin]]
name = "kian-server"
path = "src/main.rs"

[dependencies]
kian-ai = { path = "../ai" }
kian-hermes = { path = "../hermes" }
kian-agents = { path = "../agents" }
kian-bot = { path = "../bot" }
kian-contracts = { path = "../contracts" }
kian-db = { path = "../db" }
kian-domain = { path = "../domain" }
kian-nation = { path = "../nation" }
kian-wallet = { path = "../wallet" }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# oneshot without network — the fastify app.inject equivalent
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
