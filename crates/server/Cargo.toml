[package]
name = "kian-server"
version = "0.1.0"
# نکتهٔ استقرار (Railway/Railpack): پارسر TOML ی Railpack v0.43 کلیدهای نقطه‌دار وراثت
# ورک‌اسپیس (`*.workspace = true`) را نمی‌فهمد — اگر همهٔ کرت‌ها این‌شکلی باشند، هیچ
# عضوی parse نمی‌شود و Railpack باینری را کامپایل نمی‌کند («No start command detected»
# و «./bin/kian-server: No such file or directory» دقیقاً از همین می‌آید). مقدارهای این
# کرت عمداً مستقیم نوشته شده تا Railpack همیشه `kian-server` را به‌عنوان باینری دیپلوی
# پیدا کند. اگر روزی بقیهٔ کرت‌ها را هم مستقیم کردی، در Railway متغیر
# RAILPACK_CARGO_WORKSPACE=kian-server را ست کن تا انتخاب قطعی شود.
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
description = "دروازهٔ axum کرنل پول — X-KIAN-Key fail-closed، نرخ‌سنجی، چرخهٔ کامل امانت"

[[bin]]
name = "kian-server"
path = "src/main.rs"

[dependencies]
kian-ai = { path = "../ai" }
kian-hermes = { path = "../hermes" }
kian-agents = { path = "../agents" }
kian-bot = { path = "../bot" }
kian-contracts = { path = "../contracts" }
kian-db = { path = "../db" }
kian-domain = { path = "../domain" }
kian-nation = { path = "../nation" }
kian-wallet = { path = "../wallet" }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# oneshot بدون شبکه — معادل app.inject فستیفای
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
