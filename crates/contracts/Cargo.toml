[package]
name = "kian-contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "\u0642\u0631\u0627\u0631\u062f\u0627\u062f\u0647\u0627\u06cc \u0648\u0627\u06cc\u0631 — DTO\u0647\u0627\u06cc serde + utoipa 6 + \u0637\u0628\u0642\u0647‌\u0628\u0646\u062f\u06cc \u062e\u0637\u0627 + \u0627\u0645\u0646\u06cc\u062a \u0642\u0631\u0627\u0631\u062f\u0627\u062f\u06cc X-KIAN-Key"

[dependencies]
# Wire — the same JSON the TS side sends on the wire (camelCase, explicit null, integers within 2^53−1)
serde = { workspace = true }
serde_json = { workspace = true }
# OpenAPI 3.1 schema from the same DTOs — no second source of truth (ADR-005)
utoipa = { workspace = true }
# Contractual security — constant-time comparison + the official Telegram HMAC scheme
subtle = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# IsoDateTime validation (z.string().datetime({offset:true}))
chrono = { workspace = true }
# Error classification — maps the 20 domain codes onto HTTP statuses (single source for the codes)
kian-domain = { path = "../domain" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
