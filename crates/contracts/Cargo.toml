[package]
name = "kian-contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "قراردادهای وایر — DTOهای serde + utoipa 6 + طبقه‌بندی خطا + امنیت قراردادی X-KIAN-Key"

[dependencies]
# وایر — همان JSON ای که TS روی سیم می‌فرستد (camelCase، null صریح، صحیح 2^53−1)
serde = { workspace = true }
serde_json = { workspace = true }
# اسکیمای OpenAPI 3.1 از همان DTOها — بدون منبع دوم حقیقت (ADR-005)
utoipa = { workspace = true }
# امنیت قراردادی — مقایسهٔ زمان‌ثابت + طرح رسمی HMAC تلگرام
subtle = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# اعتبارسنجی IsoDateTime (z.string().datetime({offset:true}))
chrono = { workspace = true }
# طبقه‌بندی خطا — نگاشت ۲۰ کد دامنه به وضعیت HTTP (منبع واحد کدها)
kian-domain = { path = "../domain" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
