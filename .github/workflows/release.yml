name: Release
on:
  push:
    tags: ["v*"]

jobs:
  rea-exposure-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: npm i -g rea@6
      - name: REA 10/10 gate
        run: rea audit-release-exposure apps/web/.next/standalone --fail_on low
      - name: REA endpoint parity
        run: rea compare-static-and-observed-endpoints --help >/dev/null  # TODO: wire real evidence
