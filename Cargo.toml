[workspace]
resolver = "2"
members = [
    "crates/agents",
    "crates/ai",
    "crates/bot",
    "crates/contracts",
    "crates/db",
    "crates/domain",
    "crates/hermes",
    "crates/nation",
    "crates/server",
    "crates/tooling",
    "crates/wallet",
]
# Raw vault reference folders (folder 07) — standalone packages with libfuzzer/nightly;
# never workspace members, kept only as reference.
# The CopilotKit/OpenBot vault (Wave 2) is also mounted under docs/vault/ — the raw-reference
# crates ag-ui-core/ag-ui-client with independent Cargo.toml files; cargo never
# compiles them.
exclude = [
    "crates/tooling/fuzz_suite",
    "crates/tooling/vault_pro",
    "docs/vault/**",
]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
# "authors" is not declared here — only workspace-member crates inherit it;
# vault_pro (outside the workspace, pure reference) has its own independent manifest.

[workspace.dependencies]
tokio = { version = "1.54", features = ["full"] }
axum = "0.8"
# M2 — database: sqlite (a recorded legacy decision: the same v3 substrate for dual-run;
# all queries are hidden behind kian-db, so if postgres is ever needed only this line changes)
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "postgres", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "6"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }
teloxide = { version = "0.17", default-features = false }
# M2 — the money kernel
chrono = { version = "0.4", features = ["serde", "clock"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
# "http-body-util" is not declared here — server declares its own version independently
# and vault_pro is outside the workspace; an unused entry would raise a manifest warning.
# Contractual security — constant-time comparison + initData authentication (M3)
subtle = "2"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
# M4 — AI gateway: a light HTTPS client (rustls + webpki-roots; never openssl-system)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
async-trait = "0.1"

# Sandbox disk constraint — no debug info in dev (tests stay light)
[profile.dev]
debug = 0

# REA gates: native.debug_companions / rust.dependency_metadata / symbol leakage
# ElfHardening (morluto/rea v6.10.1): thin-LTO + single codegen unit + abort-on-panic
# + stripped symbols + overflow checks — the canonical hardened release profile.
[profile.release]
strip = "symbols"
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
