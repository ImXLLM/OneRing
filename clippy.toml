# کانفیگ clippy — همان قرارداد legacy با msrv فعلی
msrv = "1.100.0"
# unwrap/expect فقط داخل تست‌ها مجاز است
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# تبدیل‌های عمدی i64→u32 در مهاجرت زمان/فرکانس اسکرو (escrow.rs TTL sweep) —
# مقادیر همیشه توسط دامنه اعتبارسنجی شده‌اند؛ نشت علامت/برش هدف‌گذاری‌شده است.
# (همان تصمیم legacy در DropAgentX-pro با سطح pedantic یکسان)
allow-dbg-in-tests = true
