# clippy config — same legacy convention, current msrv
msrv = "1.100.0"
# unwrap/expect allowed only inside tests
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Deliberate i64→u32 casts in the escrow time/frequency migration (escrow.rs TTL sweep) —
