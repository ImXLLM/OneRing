            }

            function renderContactsList() {
                const filtered = CONTACTS.filter(c => {
                    if (currentFilter === 'unread' && c.unread === 0) return false;
                    if (currentFilter === 'groups' && !c.isGroup) return false;
                    if (searchQuery.trim() !== '') {
                        const q = searchQuery.trim().toLowerCase();
                        const matchName = c.name.toLowerCase().includes(q);
                        const matchLast = c.messages[c.messages.length - 1]?.text?.toLowerCase().includes(q);
                        return matchName || matchLast;
                    }
                    return true;
                });

                contactsListEl.innerHTML = filtered.map(c => {
                    const lastMsg = c.messages[c.messages.length - 1];
                    const previewText = c.isTyping
                        ? '\u062f\u0631 \u062d\u0627\u0644 \u0646\u0648\u0634\u062a\u0646...'
                        : (lastMsg?.type === 'voice' ? '🎤 \u067e\u06cc\u0627\u0645 \u0635\u0648\u062a\u06cc (' + lastMsg.duration + ')' : (lastMsg?.text || ''));

                    return `
                    <div class="contact-item ${c.id === activeContactId ? 'active' : ''}" data-contact-id="${c.id}">
                        <div class="avatar-wrapper">
                            <div class="avatar-svg-box">
                                ${createAvatarSVG(c.id, c.c1, c.c2, c.initials)}
                            </div>
                            ${c.online ? `<span class="status-dot ${c.isTyping ? 'typing-pulse' : ''}"></span>` : ''}
                        </div>
                        <div class="contact-info">
                            <div class="contact-top-row">
                                <span class="contact-name">${c.name}</span>
                                <span class="contact-time">${c.time}</span>
                            </div>
                            <div class="contact-bottom-row">
                                <span class="contact-preview ${c.isTyping ? 'is-typing' : ''}">${previewText}</span>
                                ${c.unread > 0 ? `<span class="unread-badge" id="badge_${c.id}">${toPersianDigits(c.unread)}</span>` : ''}
                            </div>
                        </div>
                    </div>`;
                }).join('');

                contactsListEl.querySelectorAll('.contact-item').forEach(row => {
                    row.addEventListener('click', () => {
                        const id = row.getAttribute('data-contact-id');
                        selectContact(id);
                    });
                });

                updateTotalUnread();
            }

            function selectContact(contactId) {
                const contact = CONTACTS.find(c => c.id === contactId);
                if (!contact) return;

                SoundEngine.playTabClick();
                activeContactId = contactId;

                // If contact has unread messages, animate viscous droplet pop before clearing
                const badgeEl = document.getElementById('badge_' + contactId);
                if (badgeEl && contact.unread > 0) {
                    badgeEl.classList.add('droplet-pop');
                    contact.unread = 0;
                    setTimeout(() => {
                        renderContactsList();
                    }, 480);
                } else {
                    contact.unread = 0;
                    renderContactsList();
                }

                updateActiveHeaderAndDrawer(contact);
                renderMessagesStream(contact);

                // Open mobile full-screen conversation view
                appFrame.classList.add('mobile-chat-open');
            }

            function updateActiveHeaderAndDrawer(contact) {
                document.getElementById('activeHeaderAvatar').innerHTML = createAvatarSVG('hdr_' + contact.id, contact.c1, contact.c2, contact.initials);
                document.getElementById('activeHeaderName').textContent = contact.name;
                const dot = document.getElementById('activeHeaderDot');
                dot.style.display = contact.online ? 'block' : 'none';

                const statusEl = document.getElementById('activeHeaderStatus');
                if (contact.isTyping) {
                    dot.classList.add('typing-pulse');
                    statusEl.innerHTML = `<span style="color:var(--accent-primary);font-weight:600;">\u062f\u0631 \u062d\u0627\u0644 \u0646\u0648\u0634\u062a\u0646</span> <span class="liquid-dots"><span></span><span></span><span></span></span>`;
                } else {
                    dot.classList.remove('typing-pulse');
                    statusEl.textContent = contact.status;
                }

                // Update Drawer
                document.getElementById('drawerAvatar').innerHTML = createAvatarSVG('drw_' + contact.id, contact.c1, contact.c2, contact.initials);
                document.getElementById('drawerName').textContent = contact.name;
                document.getElementById('drawerHandle').textContent = contact.handle;
                document.getElementById('drawerBio').textContent = contact.bio;
            }

            /* ==========================================================================
               6. MESSAGES STREAM & INTERACTIVE CANVAS AUDIO WAVEFORM
               ========================================================================== */
            function renderMessagesStream(contact) {
                messagesStreamEl.innerHTML = `<div class="date-divider">\u0627\u0645\u0631\u0648\u0632 • \u06af\u0641\u062a\u06af\u0648\u0647\u0627\u06cc \u0631\u0645\u0632\u0646\u06af\u0627\u0631\u06cc‌\u0634\u062f\u0647</div>`;

                contact.messages.forEach(msg => {
                    appendMessageElement(msg, false);
                });

                // Append persistent typing indicator bubble at bottom of stream
                const typingBubble = document.createElement('div');
                typingBubble.id = 'streamTypingBubble';
                typingBubble.className = 'stream-typing-bubble' + (contact.isTyping ? ' active' : '');
                typingBubble.innerHTML = `
                    <span style="font-size:0.78rem; color:var(--text-secondary);">\u062f\u0631 \u062d\u0627\u0644 \u0646\u0648\u0634\u062a\u0646</span>
                    <div class="liquid-dots"><span></span><span></span><span></span></div>
                `;
                messagesStreamEl.appendChild(typingBubble);

                scrollToBottom();
            }

            function appendMessageElement(msg, animate = true) {
                const row = document.createElement('div');
                row.className = `msg-row ${msg.sender === 'out' ? 'outgoing' : 'incoming'}`;
                if (!animate) row.style.animation = 'none';
                row.setAttribute('data-msg-id', msg.id);

                let contentHTML = '';
                if (msg.type === 'voice') {
                    contentHTML = `
                        <div class="voice-player" data-voice-id="${msg.id}">
                            <button class="voice-play-btn" aria-label="\u067e\u062e\u0634 \u067e\u06cc\u0627\u0645 \u0635\u0648\u062a\u06cc">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <polygon points="5 3 19 12 5 21 5 3"/>
                                </svg>
                            </button>
                            <div class="voice-wave-wrap">
                                <canvas class="voice-canvas" width="145" height="30"></canvas>
                                <div class="voice-duration">
                                    <span class="voice-timer">${msg.duration}</span>
                                    <span>\u0635\u0648\u062a HD</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    contentHTML = `<div>${escapeHTML(msg.text)}</div>`;
                }

                const checkSVG = msg.sender === 'out'
                    ? `<svg class="msg-status-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/><polyline points="16 6 9 13 7 11"/></svg>`
                    : '';

                const reactionsHTML = (msg.reactions && msg.reactions.length > 0)
                    ? `<div class="msg-reactions">${msg.reactions.map(r => `<span class="reaction-chip">${r} \u06f1</span>`).join('')}</div>`
                    : `<div class="msg-reactions"></div>`;

                row.innerHTML = `
                    <div class="msg-bubble">
                        ${contentHTML}
                        <div class="msg-meta">
                            <span>${msg.time}</span>
                            ${checkSVG}
                        </div>
                        ${reactionsHTML}
                    </div>
                `;

                const typingBubble = document.getElementById('streamTypingBubble');
                if (typingBubble) {
                    messagesStreamEl.insertBefore(row, typingBubble);
                } else {
                    messagesStreamEl.appendChild(row);
                }

                // Initialize interactive waveform canvas if voice message
                if (msg.type === 'voice') {
                    initVoiceWaveformPlayer(row.querySelector('.voice-player'), msg.sender === 'out');
                }

                // Bind Long-Press / Right-Click for Floating Emoji Reaction Bar
                const bubble = row.querySelector('.msg-bubble');
                bindReactionTriggers(bubble, msg, row);

                scrollToBottom();
            }

            function initVoiceWaveformPlayer(playerEl, isOutgoing) {
                const canvas = playerEl.querySelector('.voice-canvas');
                const btn = playerEl.querySelector('.voice-play-btn');
                const ctx = canvas.getContext('2d');
                const barsCount = 26;
                const baseHeights = Array.from({ length: barsCount }, (_, i) => 0.25 + 0.65 * Math.abs(Math.sin(i * 0.55)));
                let playing = false;
                let progress = 0;
                let rafId = null;

                function drawWave(phase = 0) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const barW = 3.2;
                    const gap = (canvas.width - barsCount * barW) / (barsCount - 1);

                    for (let i = 0; i < barsCount; i++) {
                        let ratio = baseHeights[i];
                        if (playing) {
                            ratio = 0.2 + 0.78 * Math.abs(Math.sin(phase * 0.14 + i * 0.45));
                        }
                        const h = Math.max(4, ratio * (canvas.height - 4));
                        const x = i * (barW + gap);
                        const y = (canvas.height - h) / 2;

                        const isPlayed = (i / barsCount) <= progress;
                        if (isOutgoing) {
                            ctx.fillStyle = isPlayed ? '#ffffff' : 'rgba(255,255,255,0.42)';
                        } else {
                            ctx.fillStyle = isPlayed ? '#06b6d4' : 'rgba(148, 163, 184, 0.45)';
                        }

                        ctx.beginPath();
                        ctx.roundRect(x, y, barW, h, 2);
                        ctx.fill();
                    }
                }

                drawWave(0);

                let tick = 0;
                function step() {
                    if (!playing) return;
                    tick++;
                    progress += 0.0045;
                    if (progress >= 1) {
                        playing = false;
                        progress = 0;
                        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
                        drawWave(0);
                        return;
                    }
                    drawWave(tick);
                    rafId = requestAnimationFrame(step);
                }

                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    SoundEngine.playTabClick();
                    playing = !playing;
                    if (playing) {
                        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
                        step();
                    } else {
                        cancelAnimationFrame(rafId);
                        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
                        drawWave(0);
                    }
                });
            }

            /* ==========================================================================
               7. FLOATING EMOJI REACTION POPOVER (RIGHT-CLICK / LONG-PRESS)
               ========================================================================== */
            function bindReactionTriggers(bubbleEl, msgObj, rowEl) {
                let pressTimer = null;

                bubbleEl.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    openReactionPopover(e.clientX, e.clientY, msgObj, rowEl);
                });

                bubbleEl.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    pressTimer = setTimeout(() => {
                        openReactionPopover(touch.clientX, touch.clientY, msgObj, rowEl);
                    }, 420);
                }, { passive: true });

                bubbleEl.addEventListener('touchend', () => clearTimeout(pressTimer));
                bubbleEl.addEventListener('touchmove', () => clearTimeout(pressTimer));
            }

            function openReactionPopover(x, y, msgObj, rowEl) {
                SoundEngine.playTabClick();
                targetReactionMsg = { msgObj, rowEl };
                const popW = 240;
                const clampedX = Math.min(Math.max(16, x - popW / 2), window.innerWidth - popW - 16);
                const clampedY = Math.max(65, y - 58);

                reactionPopover.style.left = clampedX + 'px';
                reactionPopover.style.top = clampedY + 'px';
                reactionPopover.classList.add('visible');
            }

            reactionPopover.querySelectorAll('.reaction-emoji-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!targetReactionMsg) return;
                    const emoji = btn.getAttribute('data-emoji');
                    const { msgObj, rowEl } = targetReactionMsg;

                    if (!msgObj.reactions) msgObj.reactions = [];
                    const idx = msgObj.reactions.indexOf(emoji);
                    if (idx > -1) {
                        msgObj.reactions.splice(idx, 1);
                    } else {
                        msgObj.reactions.push(emoji);
                    }

                    const container = rowEl.querySelector('.msg-reactions');
                    container.innerHTML = msgObj.reactions.map(r => `<span class="reaction-chip">${r} \u06f1</span>`).join('');

                    SoundEngine.playSendPop();
                    reactionPopover.classList.remove('visible');
                    targetReactionMsg = null;
                });
            });

            document.addEventListener('click', () => {
                reactionPopover.classList.remove('visible');
            });

            /* ==========================================================================
               8. SENDING MESSAGES, MORPHING BUTTON & AUTO-REPLY PERSIAN BOT
               ========================================================================== */
            messageInput.addEventListener('input', () => {
                if (messageInput.value.trim().length > 0) {
                    morphSendBtn.classList.add('has-text');
                } else {
                    morphSendBtn.classList.remove('has-text');
                }
            });

            function sendUserMessage(customPayload = null) {
                const contact = CONTACTS.find(c => c.id === activeContactId);
                if (!contact) return;

                const text = customPayload ? '' : messageInput.value.trim();
                if (!customPayload && !text) {
                    // Morph into voice recording state briefly if input is empty
                    triggerVoiceRecordSimulation();
                    return;
                }

                // Morph button into spinner briefly
                morphSendBtn.classList.add('is-sending');
                messageInput.value = '';
                morphSendBtn.classList.remove('has-text');

                setTimeout(() => {
                    morphSendBtn.classList.remove('is-sending');
                    const newMsg = customPayload || {
                        id: Date.now(),
                        sender: 'out',
                        text: text,
                        time: getNowPersianTime(),
                        reactions: []
                    };

                    contact.messages.push(newMsg);
                    contact.time = newMsg.time;
                    SoundEngine.playSendPop();
                    appendMessageElement(newMsg, true);
                    renderContactsList();

                    // Trigger realistic delayed typing indicator & Persian auto-reply
                    scheduleAutoReply(contact);
                }, 180);
            }

            function triggerVoiceRecordSimulation() {
                SoundEngine.playTabClick();
                morphSendBtn.classList.add('recording');
                messageInput.ariaLabel = '🔴 \u062f\u0631 \u062d\u0627\u0644 \u0636\u0628\u0637 \u067e\u06cc\u0627\u0645 \u0635\u0648\u062a\u06cc... (\u0627\u0631\u0633\u0627\u0644 \u062e\u0648\u062f\u06a9\u0627\u0631)';
                setTimeout(() => {
                    morphSendBtn.classList.remove('recording');
                    messageInput.ariaLabel = '\u067e\u06cc\u0627\u0645 \u062e\u0648\u062f \u0631\u0627 \u0628\u0646\u0648\u06cc\u0633\u06cc\u062f... (\u0628\u0627 \u06a9\u0644\u06cc\u062f Enter \u0627\u0631\u0633\u0627\u0644 \u06a9\u0646\u06cc\u062f)';
                    sendUserMessage({
                        id: Date.now(),
                        sender: 'out',
                        type: 'voice',
                        duration: '\u06f0\u06f0:\u06f0\u06f9',
                        time: getNowPersianTime(),
                        reactions: []
                    });
                }, 1200);
            }

            function scheduleAutoReply(contact) {
                if (typingTimeouts[contact.id]) clearTimeout(typingTimeouts[contact.id]);

                setTimeout(() => {
                    contact.isTyping = true;
                    if (contact.id === activeContactId) {
                        updateActiveHeaderAndDrawer(contact);
                        const tb = document.getElementById('streamTypingBubble');
                        if (tb) tb.classList.add('active');
                        scrollToBottom();
                    }
                    renderContactsList();

                    typingTimeouts[contact.id] = setTimeout(() => {
                        contact.isTyping = false;
                        const randomReply = AUTO_REPLIES[Math.floor(Math.random() * AUTO_REPLIES.length)];
                        const replyMsg = {
                            id: Date.now() + 1,
                            sender: 'in',
                            text: randomReply,
                            time: getNowPersianTime(),
                            reactions: []
                        };
                        contact.messages.push(replyMsg);
                        contact.time = replyMsg.time;

                        SoundEngine.playReceiveChime();

                        if (contact.id === activeContactId) {
                            const tb = document.getElementById('streamTypingBubble');
                            if (tb) tb.classList.remove('active');
                            updateActiveHeaderAndDrawer(contact);
                            appendMessageElement(replyMsg, true);
                        } else {
                            contact.unread += 1;
                        }
                        renderContactsList();
                    }, 1900);
                }, 550);
            }

            morphSendBtn.addEventListener('click', () => sendUserMessage());
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendUserMessage();
                }
            });

            document.getElementById('sendVoiceNoteBtn').addEventListener('click', () => {
                sendUserMessage({
                    id: Date.now(),
                    sender: 'out',
                    type: 'voice',
                    duration: '\u06f0\u06f0:\u06f1\u06f4',
                    time: getNowPersianTime(),
                    reactions: []
                });
            });

            document.getElementById('insertQuickEmojiBtn').addEventListener('click', () => {
                const emojis = ['🚀', '✨', '🔥', '💎', '🎨', '❤️'];
                messageInput.value += emojis[Math.floor(Math.random() * emojis.length)] + ' ';
                messageInput.focus();
                morphSendBtn.classList.add('has-text');
            });

            document.getElementById('simulateIncomingBtn').addEventListener('click', () => {
                const contact = CONTACTS.find(c => c.id === activeContactId);
                if (contact) scheduleAutoReply(contact);
            });

            /* ==========================================================================
               9. THEME ENGINE, DEVICE FRAME SWITCHER & SWIPE-TO-BACK GESTURES
               ========================================================================== */
            // Theme Switcher
            document.querySelectorAll('#themeSwitcher .dock-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    SoundEngine.playTabClick();
                    document.querySelectorAll('#themeSwitcher .dock-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const theme = btn.getAttribute('data-theme-target');
                    document.body.setAttribute('data-theme', theme);
                });
            });

            // Device Mode Switcher (Desktop vs Smartphone Frame)
            document.querySelectorAll('#deviceSwitcher .dock-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    SoundEngine.playTabClick();
                    document.querySelectorAll('#deviceSwitcher .dock-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const mode = btn.getAttribute('data-device');
                    if (mode === 'mobile') {
                        viewportStage.classList.add('is-phone-sim');
                        profileDrawer.classList.add('collapsed');
                    } else {
                        viewportStage.classList.remove('is-phone-sim');
                        profileDrawer.classList.remove('collapsed');
                    }
                });
            });

            // Search & Filter Tabs
            contactSearchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderContactsList();
            });

            document.querySelectorAll('#filterTabs .filter-pill').forEach(pill => {
                pill.addEventListener('click', () => {
                    SoundEngine.playTabClick();
                    document.querySelectorAll('#filterTabs .filter-pill').forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    currentFilter = pill.getAttribute('data-filter');
                    renderContactsList();
                });
            });

            // Toggle Profile Drawer
            const toggleDrawerBtn = document.getElementById('toggleDrawerBtn');
            function toggleProfileDrawer() {
                SoundEngine.playTabClick();
                profileDrawer.classList.toggle('collapsed');
                toggleDrawerBtn.classList.toggle('active', !profileDrawer.classList.contains('collapsed'));
            }
            toggleDrawerBtn.addEventListener('click', toggleProfileDrawer);
            document.getElementById('headerUserTrigger').addEventListener('click', (e) => {
                if (e.target.closest('#mobileBackBtn')) return;
                toggleProfileDrawer();
            });
            document.getElementById('closeDrawerMobileBtn').addEventListener('click', () => {
                profileDrawer.classList.add('collapsed');
                toggleDrawerBtn.classList.remove('active');
            });

            // Mobile Back Button & Touch Swipe-to-Back Gesture
            document.getElementById('mobileBackBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                SoundEngine.playTabClick();
                appFrame.classList.remove('mobile-chat-open');
            });

            let touchStartX = 0;
            const chatCanvasEl = document.getElementById('chatCanvas');
            chatCanvasEl.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            }, { passive: true });

            chatCanvasEl.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(dx) > 95) {
                    appFrame.classList.remove('mobile-chat-open');
                }
            }, { passive: true });

            // Sound Mute Toggle
            const soundToggleBtn = document.getElementById('soundToggleBtn');
            soundToggleBtn.addEventListener('click', () => {
                SoundEngine.enabled = !SoundEngine.enabled;
                soundToggleBtn.classList.toggle('muted', !SoundEngine.enabled);
                if (SoundEngine.enabled) SoundEngine.playTabClick();
            });

            // Mobile Bottom Navigation Bar
            document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    SoundEngine.playTabClick();
                    document.querySelectorAll('.mobile-nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const target = btn.getAttribute('data-mob-nav');
                    if (target === 'chats') {
                        currentFilter = 'all';
                        appFrame.classList.remove('mobile-chat-open');
                        profileDrawer.classList.add('collapsed');
                        renderContactsList();
                    } else if (target === 'groups') {
                        currentFilter = 'groups';
                        appFrame.classList.remove('mobile-chat-open');
                        profileDrawer.classList.add('collapsed');
                        renderContactsList();
                    } else if (target === 'profile') {
                        profileDrawer.classList.remove('collapsed');
                    }
                });
            });

            function scrollToBottom() {
                requestAnimationFrame(() => {
                    messagesStreamEl.scrollTop = messagesStreamEl.scrollHeight;
                });
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // Initialize Application
            renderStories();
            renderDrawerMedia();
            renderContactsList();
            const initialContact = CONTACTS.find(c => c.id === activeContactId);
            updateActiveHeaderAndDrawer(initialContact);
            renderMessagesStream(initialContact);
        };
    </script>
